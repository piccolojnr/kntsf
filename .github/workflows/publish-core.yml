name: Publish Core Container

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/core/**'
      - '.github/workflows/publish-core.yml'

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: apps/core

jobs:
  verify:
    name: Verify core before publishing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, redis, sqlite3, tokenizer, xml, zip
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: pnpm
          cache-dependency-path: apps/core/pnpm-lock.yaml

      - name: Prepare application environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare application
        run: php artisan key:generate --ansi

      - name: Check PHP style
        run: vendor/bin/pint --dirty --test

      - name: Run PHP tests
        run: php artisan test --compact

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: apps/core
          file: apps/core/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
