name: Core CI

on:
  pull_request:
    paths:
      - 'apps/core/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/core/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/core

jobs:
  test:
    name: Core quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, redis, sqlite3, tokenizer, xml, zip
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: pnpm
          cache-dependency-path: apps/core/pnpm-lock.yaml

      - name: Prepare application environment
        run: |
          cp .env.example .env
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare application
        run: php artisan key:generate --ansi

      - name: Check PHP style
        run: vendor/bin/pint --dirty --test

      - name: Run PHP tests
        run: php artisan test --compact

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        run: pnpm run build
