name: kntsf-core

services:
    app:
        image: ${KNTSF_IMAGE:?Set KNTSF_IMAGE in .env}
        env_file:
            - .env
        ports:
            - '${APP_BIND:-127.0.0.1:8087}:8000'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - kntsf_storage:/app/storage
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -fsS http://127.0.0.1:8000/health/database || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        restart: unless-stopped

    queue:
        image: ${KNTSF_IMAGE:?Set KNTSF_IMAGE in .env}
        command: php artisan queue:work --sleep=${QUEUE_SLEEP:-3} --tries=${QUEUE_TRIES:-3} --timeout=${QUEUE_TIMEOUT:-90}
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - kntsf_storage:/app/storage
        healthcheck:
            disable: true
        restart: unless-stopped

    scheduler:
        image: ${KNTSF_IMAGE:?Set KNTSF_IMAGE in .env}
        command: php artisan schedule:work
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - kntsf_storage:/app/storage
        healthcheck:
            disable: true
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-kntsf_core}
            POSTGRES_USER: ${DB_USERNAME:-kntsf_core}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    kntsf_storage:
    redis_data:
    postgres_data:
